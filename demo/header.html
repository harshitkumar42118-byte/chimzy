<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            text-decoration: none;
            box-sizing: border-box;

        }

        .container {
            margin: 0 auto;
            max-width: 1140px;
        }



        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            width: 100%;

        }

        .nav-list {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }



        label[for="menu-lock"] {
            display: none;
        }

    
        @media (max-width:720px) {
            .nav-list {
                position: fixed;
                flex-direction: column;
                width: 100%;
                height: 100%;
                top: 0;
                left: 100%;
                justify-content: center;
                background-color: white;
                transition: all 300ms;
            }

            label[for="menu-lock"] {
                display: flex;
                flex-direction: column;
                position: relative;
                z-index: 1;
                gap: 2px;
            }

            label[for="menu-lock"] span {
                display: flex;
                width: 16px;
                background-color: black;
                height: 2px;
                border-radius: 100px;
            }

            #menu-lock:checked~.nav-list {
                left: 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="/">startup 3</a>
                <input class="option" type="checkbox" hidden id="menu-lock" >
                <label for="menu-lock"><span></span>
                    <span></span>
                    <span></span>

                </label>
                <div class="nav-list">
                    <a href="#">API</a>
                    <a href="#">Help</a>
                    <a href="#">Login</a>
                </div>
            </nav>
        </div>

    </header>
</body>

</html>
