<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>documents</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
        }

        .split-page {
            min-height: 100vh;
            display: flex;
        }

        /* white area */
        .left-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 30px;
        }

        section {
            background-image: url(./iconbg.png);
            background-repeat: none;
            background-size: cover;
        }

        /* Form container */
        .form-box {
            width: 100%;
            max-width: 360px;
            /* form won't get too wide */
        }

        img {
            max-width: 276.2926330566406px;
            height: 48px;
            width: 100%;
            opacity: 1;

        }

        /* Logo style */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            text-decoration: none;
            color: #1e1b4b;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #7c5cff, #5b6cff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Sign in button */
        .btn-signin {
            background: linear-gradient(90deg, #5b6cff, #3b82f6);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
        }

        .btn-signin:hover {
            opacity: 0.9;
            color: white;
        }

        /* Divider line "or continue with" */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        /* Google & Facebook buttons */
        .btn-social {
            flex: 1;
            border: 1px solid #e5e7eb;
            background: white;
            color: #374151;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }

        .btn-social:hover {
            background: #f9fafb;
            color: #111;
        }

        .form-control:focus {
            border-color: #e5e7eb;
            box-shadow: none;
            outline: none;
        }
    </style>
</head>

<body>
    <section>

        <div class="split-page">

            <!-- ==================== LEFT SIDE (Form) ==================== -->
            <div class="left-panel">
                <div class="form-box">

                    <div class="mb-4">
                        <img src="Logo-2.png" alt="logo">
                    </div>

                    <h2 class="fw-bold mb-2">Sign in</h2>
                    <p class="text-muted mb-4">
                        Don't have an account?
                        <a href="#" class="text-decoration-none" style="color:#5b6cff;">Register here</a>
                    </p>

                    <form>
                        <!-- Email -->
                        <div class="mb-3">
                            <input type="email" class="form-control form-control-lg" placeholder="Email">
                        </div>

                        <!-- Pass -->
                        <div class="mb-3">
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg" id="password"
                                    placeholder="Password">

                            </div>
                        </div>

                        <!-- Remember me + Forgot password -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" checked>
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none" style="color:#5b6cff; font-size:0.9rem;">Forgot
                                password?</a>
                        </div>

                        <!-- Sign in button -->
                        <button type="submit" class="btn btn-signin">Sign in</button>
                    </form>

                    <!-- Divider -->
                    <div class="divider">or continue with</div>

                    <!-- Social buttons -->
                    <div class="d-flex gap-2">
                        <a href="#" class="btn-social">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M19.5999 10.2219C19.5999 9.3997 19.5332 8.7997 19.3888 8.17749H10V11.8885H15.511C15.4 12.8108 14.8 14.1997 13.4666 15.1329L13.4479 15.2572L16.4165 17.5569L16.6222 17.5774C18.511 15.833 19.5999 13.2663 19.5999 10.2219Z"
                                    fill="#4285F4" />
                                <path
                                    d="M10.0002 19.9999C12.7001 19.9999 14.9668 19.111 16.6224 17.5777L13.4668 15.1333C12.6224 15.7221 11.489 16.1333 10.0002 16.1333C7.35578 16.1333 5.11137 14.3889 4.3113 11.9778L4.19403 11.9877L1.10726 14.3766L1.06689 14.4888C2.71131 17.7555 6.08908 19.9999 10.0002 19.9999Z"
                                    fill="#34A853" />
                                <path
                                    d="M4.31104 11.9777C4.09994 11.3555 3.97776 10.6888 3.97776 9.99995C3.97776 9.31102 4.09994 8.64438 4.29993 8.02217L4.29434 7.88966L1.16889 5.4624L1.06663 5.51104C0.388891 6.86661 0 8.38885 0 9.99995C0 11.611 0.388891 13.1332 1.06663 14.4888L4.31104 11.9777Z"
                                    fill="#FBBC05" />
                                <path
                                    d="M10.0002 3.86662C11.8779 3.86662 13.1446 4.67772 13.8668 5.35554L16.689 2.59998C14.9557 0.988887 12.7001 0 10.0002 0C6.08908 0 2.71131 2.24441 1.06689 5.51103L4.30019 8.02216C5.11137 5.61107 7.35579 3.86662 10.0002 3.86662Z"
                                    fill="#EB4335" />
                            </svg>
                            Google
                        </a>
                        <a href="#" class="btn-social">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#clip0_49789_3111)">
                                    <path
                                        d="M20 10C20 4.47715 15.5228 0 10 0C4.47715 0 0 4.47715 0 10C0 14.9913 3.65686 19.1283 8.4375 19.8785V12.8906H5.89844V10H8.4375V7.79688C8.4375 5.29062 9.93044 3.90625 12.2146 3.90625C13.3087 3.90625 14.4531 4.10156 14.4531 4.10156V6.5625H13.1921C11.9499 6.5625 11.5625 7.33333 11.5625 8.12417V10H14.3359L13.8926 12.8906H11.5625V19.8785C16.3431 19.1283 20 14.9913 20 10Z"
                                        fill="#1877F2" />

                                        fill="white" />
                                </g>
                                <defs>
                                    <clipPath id="clip0_49789_3111">
                                        <rect width="20" height="20" fill="white" />
                                    </clipPath>
                                </defs>
                            </svg>

                            Facebook
                        </a>
                    </div>

                </div>
            </div>



        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
