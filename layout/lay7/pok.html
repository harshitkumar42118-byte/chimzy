<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Falling Ball</title>
  <style>
    body {
      margin: 0;
      background: #222;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    canvas {
      display: block;
      margin: 20px auto;
      background: #333;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>
  <h1>Catch the Falling Ball 🎮</h1>
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let basket = { x: 160, y: 450, width: 80, height: 20 };
    let ball = { x: Math.random() * 380, y: 0, radius: 10, speed:3 };
    let score = 0;

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && basket.x > 0) basket.x -= 20;
      if (e.key === "ArrowRight" && basket.x < canvas.width - basket.width) basket.x += 20;
    });

    function drawBall() {
      ctx.fillStyle = "cyan";
      ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "yellow";
      ctx.fill();
      ctx.closePath();
    }

    function drawScore() {
      ctx.fillStyle = "#fff";
      ctx.font = "16px Arial";
      ctx.fillText("Score: " + score, 10, 20);
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBasket();
      drawBall();
      drawScore();

      ball.y += ball.speed;

      // Reset ball if caught or missed
      if (
        
        ball.y + ball.radius >= basket.y &&
        ball.x > basket.x &&
        ball.x < basket.x + basket.width
      ) {
        score++;
        resetBall();
      } else if (ball.y > canvas.height) {
        score = Math.max(0, score - 1);
        resetBall();
        let ball = { x: Math.random() * 380, y: 0, radius: 10, speed: 5 };

      }

      requestAnimationFrame(update);
    }

    function resetBall() {
      
      ball.x = Math.random() * (canvas.width - ball.radius * 2) + ball.radius;

      ball.y = 0;
    }


    update();
  </script>
</body>
</html>
