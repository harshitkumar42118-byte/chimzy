<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icone" href="./Group.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
        }

        .container {
            width: 100%;
            max-width: 1440px;
            height: 810px;
        }

        .back-g {
            position: relative;
            isolation: isolate;
        }

        .back-g::before {
            content: "";
            background-image: url(./iconbg.png);
            background-position: center;
            background-size: cover;

            position: absolute;
            inset: 0;
            z-index: -1;
        }



        .head {
            width: 276px;
            height: 48px;
            opacity: 1;

        }

        img {
            width: 100%;
        }


        h2 {
            font-family: "Roboto", sans-serif;
            margin-bottom: 10px;
            font-weight: 600;
            font-style: SemiBold;
            font-size: 32px;
            line-height: 135%;
            letter-spacing: 0%;
            margin-top: 48px;

        }

        .login {
            width: 228px;
            height: 74px;
            opacity: 1;
            margin-bottom: 32px;

        }

        p {
            font-family: Lato;
            font-weight: 400;
            font-style: Regular;
            font-size: 14px;
            line-height: 150%;
            letter-spacing: 0%;
            color: #62656D;

        }

        a {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-style: Regular;
            font-size: 14px;
            line-height: 150%;

        }

        .left-side {
            max-width: 340.5px;
            width: 100%;
            height: 407.5px;
            opacity: 1;
            top: 185px;
            left: 189.5px;
            border-width: 1px;

        }

        .form {

            max-width: 340px;
            width: 100%;
            height: 131px;
            opacity: 1;
            top: 291px;
            left: 190px;
            gap: 12px;

        }

        .email {
            max-width: 340px;
            height: 44px;
            width: 100%;
            opacity: 1;
            border-width: 1px;
            gap: 10px;
            border-radius: 6px;
            border: 1px solid #EBEAED;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;

        }

        .password {
            max-width: 340px;
            width: 100%;
            height: 44px;
            opacity: 1;
            border: 1px solid #EBEAED;
            border-width: 1px;
            gap: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;

        }

        .input {
            max-width: 280px;
            width: 100%;
            height: 24px;
            opacity: 1;
            gap: 10px;
            border-radius: 6px;
            border: none;

        }

        .pass {
            max-width: 252px;
            width: 100%;
            height: 24px;
            opacity: 1;
            gap: 10px;
            border-radius: 6px;
            border: none;

        }

        .forgot {
            max-width: 340px;
            width: 100%;
            height: 21px;
            justify-content: space-between;
            opacity: 1;
            display: flex;
            margin-bottom: 24px;

        }

        .call {
            max-width: 113px;
            width: 100%;
            height: 21px;
            opacity: 1;
            gap: 10px;
            display: flex;
            align-items: center;

        }

        .click {
            max-width: 14px;
            height: 14px;
            opacity: 1;
            gap: 5.83px;
            border-radius: 2.33px;
            padding: 2.33px;
width: 100%;
        }

        .remember {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-style: Regular;
            font-size: 14px;
            line-height: 150%;
            letter-spacing: 0%;
            color: #62656D;

        }

        .for {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-size: 14px;
            line-height: 150%;
            letter-spacing: 0%;
            text-align: right;
            color: #62656D;

        }

        .icon {
            margin-left: 16px;
        }

        .btn {
            max-width: 340px;
            width: 100%;
            height: 48px;
            gap: 10px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2194FF;
            color: white;
            border: none;
        }

        .btn:hover {
            background-color: white;
            color: black;
            cursor: pointer;
        }


        button {
            font-family: Poppins;
            font-weight: 400;
            font-size: 16px;
            line-height: 20px;
            letter-spacing: 0px;
            text-align: center;
            vertical-align: middle;
        }

        .continue {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 26px;
            margin-bottom: 20px;
        }

        .box {
            max-width: 50%;
            width: 100%;
        }

        .line {
            width: 100%;
            max-width: 115px;;
            height: 1px;
            background-color: rgba(201, 207, 219, 0.3);
        }

        .or-with {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-size: 14px;
            line-height: 150%;
            color: #9197A6;
        }

        .app {
            display: flex;
            max-width: 340px;
            width: 100%;
            height: 41px
        }

        .google {
            display: flex;
            max-width: 166px;
            width: 100%;
            height: 41px;
            opacity: 1;
            border-width: 1px;
            padding-top: 10px;
            padding-right: 16px;
            padding-bottom: 10px;
            padding-left: 16px;
            gap: 10px;
            border-radius: 6px;
            border: 1px solid #EBEAED;

        }

        .gole {
            font-family: Lato;
            font-weight: 400;
            font-style: Regular;
            font-size: 14px;
            line-height: 150%;
            letter-spacing: 0%;
            color: #62656D;

        }

        .facebook {
            margin-left: 8px;
            display: flex;
            max-width: 166px;
            height: 41px;
            width: 100%;
            opacity: 1;
            border-width: 1px;
            padding-top: 10px;
            padding-right: 16px;
            padding-bottom: 10px;
            padding-left: 16px;
            gap: 10px;
            border-radius: 6px;
            border: 1px solid #EBEAED;

        }

        .fb {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-style: Regular;
            font-size: 14px;
            line-height: 150%;
            letter-spacing: 0%;
            color: #62656D;

        }
    </style>
</head>
